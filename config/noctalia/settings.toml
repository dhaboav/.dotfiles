[nightlight]
temperature_night = 5400

[shell.launcher]
categories = false
layout = "simple"
show_settings_button = false
track_usage = false
width = 600

[shell.panel]
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"

[shell.session]
grid = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    glyph = "moon"
    label = "Sleep"
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    label = "Restart"
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    label = "Power Off"
    shortcut = "KP_5"
    variant = "destructive"

[theme]
builtin = "Catppuccin"
community_palette = "GruvboxAlt"
mode = "dark"
shell_mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "niri" ]

[wallpaper]
directory = "/data/photos/04-Laptop`s Wallpapers"
transition = [ "golden" ]

    [wallpaper.default]
    path = "/data/photos/04-Laptop`s Wallpapers/desktop033.jpg"

    [wallpaper.last]
    path = "/data/photos/04-Laptop`s Wallpapers/desktop033.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/data/photos/04-Laptop`s Wallpapers/desktop033.jpg"

[widget.active_window]
display = "icon_only"

[widget.battery]
display_mode = "graphic"
interactive = false

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.clock]
anchor = true
capsule_foreground = "primary"
color = "primary"
font_weight = 700
format = "{:%-I:%M:%S %p} · {:%a %d}"

[widget.cpu]
show_tooltip = false
visualization = "none"

[widget.input_volume]
hide_when_inactive = true

[widget.network]
show_label = false
show_tooltip = false

[widget.network_rx]
glyph = "arrow-down"
interactive = false
network_speed_decimal_places = 0
network_speed_unit = "kb"
visualization = "none"

[widget.network_tx]
glyph = "arrow-up"
interactive = false
network_speed_unit = "kb"
visualization = "none"

[widget.ram]
interactive = false
stat = "ram_pct"
visualization = "none"

[widget.taskbar]
group_single_icon_per_app = true
inactive_opacity = 0.40000000000000002
only_active_workspace = true
show_active_indicator = false
show_tooltip = false

[widget.volume]
device = "input"
hide_when_inactive = true

[widget.workspaces]
change_color_on_hover = false
font_scale = 1.01
hide_when_empty = true
occupied_color = "primary_container"
pill_scale = 0.65000000000000002
show_labels = false
show_tooltip = false
