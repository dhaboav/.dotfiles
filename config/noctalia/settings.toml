[backdrop]
enabled = true
tint_intensity = 0.19999999552965164

[bar.default]
background_opacity = 0.4999999888241291
end = [ "group:g3", "group:g1", "group:g2", "battery" ]
margin_ends = 10
radius = 80
start = [ "workspaces", "taskbar" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = ""
    border_width = 0.0
    enabled = true
    fill = "scrim"
    id = "g1"
    members = [ "network_rx", "network_tx" ]
    opacity = 1.0
    padding = 8.0
    widget_spacing = 8

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "on_hover"
    id = "g2"
    members = [ "input_volume", "network", "bluetooth" ]
    opacity = 0.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "scrim"
    id = "g3"
    members = [ "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 30

[bluetooth]
connection_notifications = true

[brightness]
minimum_brightness = 0.0099999997764825821

[calendar]
enabled = true

[control_center]
